[build-system]
# Pinned so every machine builds the extension with the same tools (an unpinned build once differed per host).
requires = ["scikit-build-core==1.1.1", "nanobind==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "nanolance"
# Keep in step with NANOLANCE_VERSION_* in the top-level CMakeLists.txt: this wheel ships
# that library, so two different numbers for one artifact only confuse.
version = "0.2.0"
description = "Fast zero-copy Python bindings for the nanolance Lance writer/reader"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Yoav Bendor" }]
keywords = ["arrow", "lance", "zero-copy", "nanoarrow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
# `python -m nanolance` works from the package alone; this makes `nanolance convert a.parquet b.lance`
# work straight after `pip install nanolance`, which is the form the docs show.
nanolance = "nanolance.__main__:main"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-xdist", "pytest-timeout", "pyarrow>=16", "pandas>=2", "polars>=1", "duckdb", "tqdm", "ml_dtypes", "pydantic", "psutil>=5.9", "pylance==12.0.0 ; python_version >= '3.10'", "pylance>=0.17,<13 ; python_version < '3.10'"]
bench = ["pyarrow>=16", "psutil>=5.9", "pylance>=0.17"]

# uv (`uv sync`, `uv run`) reads these groups. They are the packages .github/workflows/bindings-python.yml
# installs, and pylance is pinned to 12.0.0 (Python 3.10 and newer; pylance 12 has no 3.9 wheels): the version
# the tests and tools/pylance_suite.py compare with (pylance 13 changes results in about 16 tests). uv.lock pins every version (docs/BUILDING_BEHIND_A_FIREWALL.md).
[dependency-groups]
test = ["pytest>=7", "pytest-xdist", "pytest-timeout", "pyarrow>=16", "pandas>=2", "polars>=1", "duckdb", "tqdm", "ml_dtypes", "pydantic", "psutil>=5.9", "pylance==12.0.0 ; python_version >= '3.10'", "pylance>=0.17,<13 ; python_version < '3.10'"]
bench = ["pyarrow>=16", "psutil>=5.9", "pylance>=0.17"]

[project.urls]
Homepage = "https://github.com/yoavbendor/nanolance"
Repository = "https://github.com/yoavbendor/nanolance"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
cmake.source-dir = "."
wheel.packages = ["nanolance"]
# Package only what nanolance installs. Without this, any dependency whose install() rules run ends
# up inside the wheel -- nanoarrow and zstd shipped 2 MB of headers into site-packages/include/ and
# two unused shared libraries before this was pinned down.
install.components = ["nanolance_python"]

# ── Wheels ───────────────────────────────────────────────────────────────────────────────────────
# `pip install nanolance` is the whole on-ramp for the audience this library is trying to reach, and
# nothing else reaches them without it: the alternative is CMake, a C++20 toolchain, and network for
# FetchContent.
#
# The build fetches nanoarrow and zstd and links them STATICALLY, so a wheel needs no shared library
# at runtime and auditwheel/delocate have nothing to bundle. It does need `git` and network inside
# the build container, which every manylinux image has.
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
# 32-bit and PyPy: nanolance assumes a 64-bit size_t in several decode-path bounds checks, and PyPy
# is untested with nanobind here. Neither is worth claiming support for without a CI job behind it.
skip = ["*_i686", "*-win32", "pp*"]
build-frontend = "build"
test-requires = ["pyarrow"]
# Deliberately not the pytest suite: that needs pylance, polars and pandas, which would be testing
# THEIR wheels. See tests/wheel_smoke.py for what this checks instead.
#
# `{package}`, NOT `{project}`. cibuildwheel is invoked from the repository root with
# `package-dir: bindings/python`, and the two placeholders are different directories: `{project}` is
# the working directory cibuildwheel was called in (the repo root), `{package}` is the package
# directory. With `{project}` every wheel job failed at the very last step, after building and
# repairing the wheel successfully:
#
#     can't open file '/Users/runner/work/nanolance/nanolance/tests/wheel_smoke.py'
test-command = "python {package}/tests/wheel_smoke.py"

[tool.cibuildwheel.linux]
# manylinux_2_28 for a C++20 toolchain (GCC 12); the older manylinux2014 image's GCC 10 cannot build
# this tree.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# 13.3 is the first target whose C++ library has floating-point to_chars and from_chars, which the
# tree uses. Older macOS releases are not supported.
environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "bench: performance/size benchmarks (optional)",
]
