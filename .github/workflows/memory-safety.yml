# SPDX-License-Identifier: Apache-2.0
name: Memory safety

# nanolance's reader parses untrusted on-disk Lance files, so we exercise the read path under
# sanitizers and fuzz it. See docs/SAFETY.md for the threat model and reviewer checklist.

on:
  push:
    branches: [main, "claude/**", "cursor/**"]
    paths:
      - "include/**"
      - "src/**"
      - "generated/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/memory-safety.yml"
  pull_request:
    paths:
      - "include/**"
      - "src/**"
      - "generated/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/memory-safety.yml"
  workflow_dispatch:

concurrency:
  group: memory-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitizers:
    name: ASan + UBSan (ctest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          # Tolerate flaky third-party apt repos on the runner (azure-cli mirror occasionally 404s).
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++-13 python3 python3-pip
          # pyarrow + pylance drive the arrowipc2lance / interop smoke tests (they error, not skip, when
          # missing). Mirrors the bench workflow's setup so the same suite runs under sanitizers.
          python3 -m pip install --quiet --break-system-packages pyarrow pylance || python3 -m pip install --quiet pyarrow pylance

      - name: Cache fetched deps
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-asan-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (address,undefined)
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13 \
            -DNANOLANCE_SANITIZER=address,undefined \
            -DNANOLANCE_BUILD_EXAMPLES=OFF -DNANOLANCE_BUILD_FUSE_EXAMPLE=OFF

      - name: Build
        run: cmake --build build-asan -j

      # UBSan halts on any undefined behavior; ASan catches OOB/use-after-free; LSan (detect_leaks=1)
      # catches leaks — across the whole suite.
      - name: Run test suite under sanitizers
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ctest --test-dir build-asan -L smoke --output-on-failure

  fuzz:
    name: libFuzzer (decode chain)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang-18 libclang-rt-18-dev

      - name: Cache fetched deps
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-fuzz-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure fuzzers
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DNANOLANCE_BUILD_FUZZERS=ON \
            -DNANOLANCE_BUILD_TESTS=OFF -DNANOLANCE_BUILD_TOOLS=OFF \
            -DNANOLANCE_BUILD_EXAMPLES=OFF -DNANOLANCE_BUILD_FUSE_EXAMPLE=OFF

      - name: Build fuzzer
        run: cmake --build build-fuzz --target nanolance_fuzz_decode -j

      # 2 minutes per push is enough to catch regressions; extend for a scheduled nightly run.
      - name: Fuzz the decode chain
        env:
          UBSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: |
          mkdir -p corpus
          ./build-fuzz/nanolance_fuzz_decode -max_total_time=120 -print_final_stats=1 corpus

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            oom-*
            timeout-*
          if-no-files-found: ignore
