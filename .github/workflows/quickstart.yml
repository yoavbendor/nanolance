# SPDX-License-Identifier: Apache-2.0
#
# Guards the first command a new user runs. The README and docs/getting-started.md say the library
# builds without the nanotins submodule; this job proves it by doing exactly what a new user does --
# a NON-RECURSIVE checkout followed by the documented cmake invocation, with no extra flags.
#
# It also covers the second quick-start trap: `pip install -e bindings/python` uses scikit-build-core
# (Ninja) while the documented cmake call uses Makefiles, and a shared FetchContent cache directory
# bakes in whichever generator created it. Running both in one job proves they coexist.
name: quickstart

on:
  push:
    branches: [main, "claude/**", "cursor/**"]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "examples/**/CMakeLists.txt"
      - "bindings/python/**"
      - ".github/workflows/quickstart.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "examples/**/CMakeLists.txt"
      - "bindings/python/**"
      - ".github/workflows/quickstart.yml"
  workflow_dispatch:

concurrency:
  group: quickstart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  non-recursive-clone:
    name: documented quick start, no submodules
    runs-on: ubuntu-24.04
    steps:
      # submodules defaults to false -- that is the point of this job. Do not add `submodules: true`.
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ python3-dev

      - name: Confirm the submodule really is absent
        run: |
          if [ -f examples/pcapng2lance/extern/nanotins/CMakeLists.txt ]; then
            echo "::error::nanotins submodule is checked out; this job must run without it"
            exit 1
          fi

      # Verbatim from README.md / docs/getting-started.md -- no extra flags.
      - name: Configure (exactly as documented)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: The example must be skipped, not fatal
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee reconfigure.log
          grep -q "skipping the pcapng2lance example" reconfigure.log

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  mixed-generators:
    name: pip install then documented cmake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ python3-dev
          python3 -m pip install --upgrade pip

      # scikit-build-core picks Ninja; the documented cmake call below picks Makefiles. Before the
      # FetchContent cache was keyed by generator this second step died with
      # "Does not match the generator used previously: Ninja".
      - name: pip install the bindings (Ninja)
        run: python3 -m pip install -e bindings/python

      - name: Configure + build the library afterwards (Unix Makefiles)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)" --target arrowipc2lance
