# SPDX-License-Identifier: Apache-2.0
name: Python bindings

on:
  push:
    branches: [main, "claude/**", "cursor/**"]
    paths:
      - "bindings/python/**"
      - "tools/pylance_suite.py"
      - "tools/lance_c_*.py"
      - "compat/**"
      - "tests/lance_c/**"
      - "include/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/bindings-python.yml"
  pull_request:
    paths:
      - "bindings/python/**"
      - "tools/pylance_suite.py"
      - "tools/lance_c_*.py"
      - "compat/**"
      - "tests/lance_c/**"
      - "include/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/bindings-python.yml"
  workflow_dispatch:

concurrency:
  group: bindings-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++-13 python3.12-dev libcurl4-openssl-dev

      - name: Cache fetched deps
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-bindings-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'bindings/python/CMakeLists.txt') }}

      - name: Install package + test deps
        working-directory: bindings/python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[test]"

      - name: Run pytest (parity, full cycle, memory)
        working-directory: bindings/python
        run: pytest -m "not bench"

      # s3:// reads (docs/tasks/OBJECT_STORE_READS.md) against a local S3 server. moto, as in
      # nanos3reader's CI (the minio/minio image can no longer be pulled). With the endpoint set the
      # tests run and must pass; a binding built without S3 fails them by name.
      - name: Start the S3 server (moto)
        run: |
          # Its own venv: the system Python's apt boto3 / pyOpenSSL break against pip's cryptography.
          python3 -m venv /tmp/motoenv
          /tmp/motoenv/bin/pip install --quiet "moto[server]==5.2.4"
          nohup /tmp/motoenv/bin/moto_server -H 127.0.0.1 -p 5055 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5055/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:5055/ > /dev/null || { cat /tmp/moto.log; exit 1; }
          curl -sf -X PUT http://127.0.0.1:5055/nl-test

      # lance-c's reader of s3:// datasets (tests/lance_c_s3_read.cpp), built with S3 and -Werror.
      - name: Build lance-c's S3 reader
        run: |
          cmake -S . -B build-s3 -G Ninja -DCMAKE_BUILD_TYPE=Release -DNANOLANCE_ENABLE_S3=ON -DNANOLANCE_WERROR=ON
          cmake --build build-s3 --target lance_c_s3_read

      - name: Run the object-store tests
        working-directory: bindings/python
        env:
          NANOLANCE_S3_TEST_ENDPOINT: http://127.0.0.1:5055
          NANOLANCE_LANCE_C_S3_READ: ${{ github.workspace }}/build-s3/lance_c_s3_read
        run: |
          pytest -o addopts= -q -rs tests/test_object_store.py tests/test_object_store_writes.py tests/test_object_store_commits.py | tee /tmp/object-store-tests.log
          if grep -q skipped /tmp/object-store-tests.log; then echo "object-store tests must not skip here"; exit 1; fi

      # The checker users run against a real bucket (tools/s3_real_check.py), here on moto with the fault
      # and large-upload checks: every check must pass (it found the 0-byte upload of objects over 8 MiB).
      - name: Run the S3 checker against moto
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_REGION: us-east-1
        run: |
          python3 tools/s3_real_check.py s3://nl-test/s3-check --endpoint http://127.0.0.1:5055 --allow-http \
            --faults --large --report /tmp/s3-check.json

      - name: Upload the S3 server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: moto-log
          path: /tmp/moto.log

      # The same suite with every read cut into 1 KiB row ranges on 8 threads: every page of every
      # column split mid-page, the path a large read takes on a many-core machine (AGENTS.md 6a).
      - name: Run pytest under the parallel-read stress setting
        working-directory: bindings/python
        env:
          NANOLANCE_THREADS: "8"
          NANOLANCE_MORSEL_KB: "1"
        run: pytest -m "not bench" -q

      # pylance's own test suite, at the release nanolance.lance tracks, against nanolance.lance
      # (docs/PYLANCE_COMPAT.md). Fails when a test listed in tests/pylance_suite/expected_pass.txt
      # stops passing.
      - name: pylance's test suite against nanolance.lance
        run: |
          python3 -m pip install pytest-xdist pytest-timeout pandas polars duckdb tqdm ml_dtypes pydantic "pylance==12.0.0"
          python3 tools/pylance_suite.py --report pylance-suite.json

      # lance-c's own C and C++ tests, at the lance-c commit whose header compat/lance-c vendors,
      # against nanolance's liblance_c (docs/LANCE_C_COMPAT.md). Fails when a test listed in
      # tests/lance_c/expected_pass.txt stops passing.
      - name: lance-c's C/C++ tests against liblance_c
        run: python3 tools/lance_c_suite.py --build-dir build-lance-c

      - name: Run benchmark smoke (informational)
        working-directory: bindings/python
        run: pytest -m bench
