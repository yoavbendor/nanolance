# SPDX-License-Identifier: Apache-2.0
name: Python bindings

on:
  push:
    branches: [main, "claude/**", "cursor/**"]
    paths:
      - "bindings/python/**"
      - "tools/pylance_suite.py"
      - "tools/lance_c_*.py"
      - "compat/**"
      - "tests/lance_c/**"
      - "include/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/bindings-python.yml"
  pull_request:
    paths:
      - "bindings/python/**"
      - "tools/pylance_suite.py"
      - "tools/lance_c_*.py"
      - "compat/**"
      - "tests/lance_c/**"
      - "include/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/bindings-python.yml"
  workflow_dispatch:

concurrency:
  group: bindings-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++-13 python3.12-dev

      - name: Cache fetched deps
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-bindings-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'bindings/python/CMakeLists.txt') }}

      - name: Install package + test deps
        working-directory: bindings/python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[test]"

      - name: Run pytest (parity, full cycle, memory)
        working-directory: bindings/python
        run: pytest -m "not bench"

      # The same suite with every read cut into 1 KiB row ranges on 8 threads: every page of every
      # column split mid-page, the path a large read takes on a many-core machine (AGENTS.md 6a).
      - name: Run pytest under the parallel-read stress setting
        working-directory: bindings/python
        env:
          NANOLANCE_THREADS: "8"
          NANOLANCE_MORSEL_KB: "1"
        run: pytest -m "not bench" -q

      # pylance's own test suite, at the release nanolance.lance tracks, against nanolance.lance
      # (docs/PYLANCE_COMPAT.md). Fails when a test listed in tests/pylance_suite/expected_pass.txt
      # stops passing.
      - name: pylance's test suite against nanolance.lance
        run: |
          python3 -m pip install pytest-xdist pytest-timeout pandas polars duckdb tqdm ml_dtypes pydantic "pylance==12.0.0"
          python3 tools/pylance_suite.py --report pylance-suite.json

      # lance-c's own C and C++ tests, at the lance-c commit whose header compat/lance-c vendors,
      # against nanolance's liblance_c (docs/LANCE_C_COMPAT.md). Fails when a test listed in
      # tests/lance_c/expected_pass.txt stops passing.
      - name: lance-c's C/C++ tests against liblance_c
        run: python3 tools/lance_c_suite.py --build-dir build-lance-c

      - name: Run benchmark smoke (informational)
        working-directory: bindings/python
        run: pytest -m bench
