name: linux-bench

# Builds + tests + benchmarks + profiles nanolance on an Ubuntu/clang runner. On the default branch
# (main) it commits the results to bench/linux-ci-results.md so they can be pulled back; on every
# other branch it still runs the full build/test/bench for CI signal but does NOT commit results.
# This keeps the CI-owned results file out of feature branches entirely, so run-to-run benchmark
# noise can never produce merge conflicts on that file. This file is CI-owned: only this workflow
# writes it. Local runs use bench/linux-local-results.md (see bench/run-local-bench.sh) so the two
# never collide. Path filter excludes bench/ so the results commit (also tagged [skip ci]) does not
# retrigger.
on:
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
      - 'generated/**'
      - 'CMakeLists.txt'
      - '.github/workflows/linux-bench.yml'
  workflow_dispatch:
    inputs:
      matrix_runs:
        description: "Timed runs per matrix entry (3 on every push; more for a steadier baseline)"
        default: "3"
      skip_perf:
        description: "Skip the index performance gate (time is pressing); a push can say [skip perf] instead"
        type: boolean
        default: false
      record_perf_baseline:
        description: "Record this runner's index baseline (bench/results/perf) and commit it to this branch"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # vendored nanotins (examples/pcapng2lance/extern/nanotins) must be present

      - name: Install dependencies
        run: |
          sudo apt-get update
          # clang-19 fixes the ICE (exit 139) that clang 18.1.3 hits on dpar/lldp2lance_main.cpp
          sudo apt-get install -y clang-19 ninja-build valgrind cmake libfuse3-dev
          # pylance is pinned: the benchmark baselines (bench/results/ci, bench/results/perf) are pylance 12.0.0.
          python3 -m pip install --quiet --break-system-packages pyarrow "pylance==12.0.0" || python3 -m pip install --quiet pyarrow "pylance==12.0.0"

      # Cache the FetchContent downloads + dep builds (a standalone configure parks them in ./.deps).
      # Keyed on the CMakeLists that declare the pins (nanoarrow/zstd/CLI11/nanos3reader), so a bump busts it.
      - name: Cache fetched deps
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-clang19-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-clang19-

      - name: Configure + build (clang, Release)
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          # NANOLANCE_BUILD_EXAMPLES=OFF: dpar/lldp2lance_main.cpp trigger clang ICEs on both
          # clang-18 and clang-19; pcapng2lance also requires the nanotins submodule which CI
          # does not need for core library tests.
          # NANOLANCE_WERROR=ON: -Wall -Wextra -Werror on nanolance's own three library targets
          # (not on FetchContent'd deps, the tools or the tests -- see CMakeLists). The option
          # defaults OFF so a downstream build on an unknown compiler cannot be broken by a new
          # warning; CI is where the ratchet belongs. This job is the clang side of it;
          # memory-safety.yml is the gcc side.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNANOLANCE_WERROR=ON \
            -DNANOLANCE_BUILD_EXAMPLES=OFF \
            -DNANOLANCE_BUILD_FUSE_EXAMPLE=ON
          cmake --build build -j

      - name: C++ smoke tests
        run: |
          ctest --test-dir build -L smoke \
            -E "golden|blob_v2_smoke|nonnull|ignore_nullability|inspect|append_smoke|version|help" \
            --output-on-failure | tee /tmp/ctest.txt

      - name: Interop tests (stock lance reads our files)
        run: |
          ctest --test-dir build -L interop --output-on-failure

      - name: Benchmark (size + write/read time)
        env:
          BENCH_TMP: /tmp/nlb
        run: |
          # bench.py times nanolance in-process too (the Python binding), beside the CLI.
          python3 -m pip install --quiet --break-system-packages ./bindings/python numpy \
            || python3 -m pip install --quiet ./bindings/python numpy
          python3 tools/bench.py | tee /tmp/bench.txt

      # nanolance against Rust Lance on the 27-type matrix (a tenth of the rows), compared as ratios
      # to Rust measured in the same run with the baseline for this runner's CPU in bench/results/ci/
      # (ubuntu-latest mixes CPUs, and the ratios differ between them): fails on any wrong or
      # missing read, a data type twice as slow relative to Rust on one core and on all cores, or a
      # mean 25% down (tools/bench_compare.py).
      - name: Benchmark matrix (quick)
        run: |
          python3 -m pip install --quiet --break-system-packages ./bindings/python numpy \
            || python3 -m pip install --quiet ./bindings/python numpy
          python3 tools/bench_matrix.py --quick --runs "${{ github.event.inputs.matrix_runs || '3' }}" \
            --out /tmp/matrix-quick.json

      # The index benchmarks (scalar indexes, vector indexes, full-text) at quick scale, each timed
      # against pylance in the same process run, then gated by tools/perf_gate.py. Runs in sequence:
      # concurrent runs share the cores and swing the ratios by 2x. Skip with the dispatch input
      # skip_perf or a [skip perf] commit message.
      # The Rust Lance driver (tools/lance_rs_bench, the lance crate 12.0.0 with no Python), cached by its
      # lockfile: the first run builds the crate's dependencies, later runs reuse them.
      - name: Cache the Rust Lance driver
        if: ${{ !inputs.skip_perf && !contains(github.event.head_commit.message, '[skip perf]') }}
        uses: actions/cache@v4
        with:
          path: tools/lance_rs_bench/target
          key: lance-rs-bench-${{ runner.os }}-${{ hashFiles('tools/lance_rs_bench/Cargo.lock') }}

      - name: Build the Rust Lance driver
        if: ${{ !inputs.skip_perf && !contains(github.event.head_commit.message, '[skip perf]') }}
        run: |
          # The lance crate's build scripts compile .proto files with protoc, which the runner image may not
          # ship (the C++ build does not need it): install it explicitly.
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          cargo build --release --manifest-path tools/lance_rs_bench/Cargo.toml

      # The index benchmarks at quick scale, nanolance's C++ library against Rust Lance, each sample
      # repeated until 10 seconds of timed work (tools/index_bench_common.py). nanolance's driver is
      # built by the job's CMake build (build/nlbench_index). Runs in sequence: concurrent runs share the
      # cores and swing the ratios.
      - name: Index benchmarks (scalar, vector, full-text; quick scale, nanolance vs Rust Lance)
        if: ${{ !inputs.skip_perf && !contains(github.event.head_commit.message, '[skip perf]') }}
        run: |
          python3 -m pip install --quiet --break-system-packages ./bindings/python numpy \
            || python3 -m pip install --quiet ./bindings/python numpy
          python3 tools/bench_scalar_index.py --rows 500000 --work /tmp/nlb-idx --out /tmp/perf-scalar.json
          python3 tools/bench_vector_index.py --rows 50000 --work /tmp/nlb-idx --out /tmp/perf-vector.json
          python3 tools/bench_fts.py --rows 100000 --work /tmp/nlb-idx --out /tmp/perf-fts.json

      - name: Performance gate (index benchmarks against Rust Lance)
        id: gate
        if: ${{ !inputs.skip_perf && !contains(github.event.head_commit.message, '[skip perf]') && !inputs.record_perf_baseline }}
        run: |
          set -o pipefail
          python3 tools/perf_gate.py --scalar /tmp/perf-scalar.json --vector /tmp/perf-vector.json \
            --fts /tmp/perf-fts.json --baseline-dir bench/results/perf | tee /tmp/gate.txt

      - name: Record the index baseline for this runner (manual runs only)
        if: ${{ inputs.record_perf_baseline && !inputs.skip_perf }}
        run: |
          SLUG=$(python3 -c "import os, sys; sys.path.insert(0, 'tools'); import perf_gate as g; print(f'{g.cpu_slug(g.cpu_name())}-{os.cpu_count()}c')")
          mkdir -p bench/results/perf
          python3 tools/perf_gate.py --scalar /tmp/perf-scalar.json --vector /tmp/perf-vector.json \
            --fts /tmp/perf-fts.json --record "bench/results/perf/$SLUG.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bench/results/perf
          git commit -m "ci: index performance baseline for $SLUG [skip ci]" && git push

      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.skip_perf }}
        with:
          name: perf-index
          path: /tmp/perf-*.json
          if-no-files-found: ignore

      # What the publish job needs: the gate's outcome as pass, fail or skipped, and its output.
      - name: Record the gate outcome
        if: always()
        run: |
          case "${{ steps.gate.outcome }}" in
            success) echo pass > /tmp/gate-status.txt ;;
            failure) echo fail > /tmp/gate-status.txt ;;
            *) echo skipped > /tmp/gate-status.txt ;;
          esac
          touch /tmp/gate.txt

      # The matrix (pylance) and the index suites (Rust Lance), for the publish job: it writes them to the
      # gh-pages site, where they stay. See tools/bench_publish.py.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: |
            /tmp/matrix-quick.json
            /tmp/perf-scalar.json
            /tmp/perf-vector.json
            /tmp/perf-fts.json
            /tmp/gate.txt
            /tmp/gate-status.txt
          if-no-files-found: ignore

      # The run's matrix, kept so the baseline can be re-recorded on this runner type: as an artifact,
      # and as one log line (MATRIX_JSON ...) for tools that read job logs. To re-baseline, run this
      # workflow by hand (more matrix_runs for a steadier median) and commit that JSON as
      # bench/results/ci/<cpu>-<cores>c.json -- once per CPU the runs land on.
      - name: Keep the matrix
        if: always()
        run: |
          python3 -c "import json; print('MATRIX_JSON ' + json.dumps(json.load(open('/tmp/matrix-quick.json')), separators=(',', ':')))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-quick
          path: /tmp/matrix-quick.json
          if-no-files-found: ignore

      - name: Regression check
        run: python3 tools/bench_compare.py bench/results/ci /tmp/matrix-quick.json

      - name: Profile native read (callgrind on pcap_ref)
        run: |
          DS=/tmp/nlb/pcap_ref_nl.lance
          valgrind --tool=callgrind --callgrind-out-file=/tmp/cg.out \
            build/nlbench "$DS" 1 || true
          callgrind_annotate --threshold=98 /tmp/cg.out 2>/dev/null \
            | sed -n '1,60p' > /tmp/callgrind.txt || echo "callgrind_annotate unavailable" > /tmp/callgrind.txt

      - name: Assemble results
        run: |
          mkdir -p bench
          {
            echo "# Linux CI results (auto-generated — do not edit)"
            echo
            echo "_$(date -u '+%Y-%m-%d %H:%M:%S UTC') · commit \`$(git rev-parse --short HEAD)\`_"
            echo
            echo '## Environment'
            echo '```'
            uname -a
            (clang-19 --version | head -1)
            (cmake --version | head -1)
            echo '```'
            echo
            echo '## Tests'
            echo '```'
            tail -n 3 /tmp/ctest.txt
            echo '```'
            echo
            echo '## Benchmark (parquet vs rust lance vs nanolance)'
            echo '```'
            cat /tmp/bench.txt
            echo '```'
            echo
            echo '## Native-read profile (callgrind, nlbench on pcap_ref)'
            echo '```'
            cat /tmp/callgrind.txt
            echo '```'
          } > bench/linux-ci-results.md

      - name: Commit results back
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bench/linux-ci-results.md
          git commit -m "ci: linux benchmark + profile results [skip ci]" || { echo "no changes"; exit 0; }
          git push

  # Publishes the run to the gh-pages site (bench/), where the results are read when wanted and the README
  # summary image is served from. Runs one at a time across all branches (the concurrency group), so pushes to
  # gh-pages never race. On the default branch it also writes the summary table into README.md. Feature-branch
  # runs never change a tracked file: their results land on the site, labelled with the branch.
  publish:
    needs: bench
    if: ${{ always() && needs.bench.result != 'cancelled' }}
    runs-on: ubuntu-latest
    concurrency:
      group: bench-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bench-results
          path: /tmp/bench-in

      - name: Check out the gh-pages site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Publish the run to the site
        run: |
          set -eu
          if [ ! -f /tmp/bench-in/matrix-quick.json ]; then
            echo "no matrix results from this run: nothing to publish"
            exit 0
          fi
          args="--matrix /tmp/bench-in/matrix-quick.json --gate $(cat /tmp/bench-in/gate-status.txt)"
          args="$args --gate-log /tmp/bench-in/gate.txt --site pages/bench --branch $GITHUB_REF_NAME"
          for suite in scalar vector fts; do
            if [ -f "/tmp/bench-in/perf-$suite.json" ]; then args="$args --$suite /tmp/bench-in/perf-$suite.json"; fi
          done
          if [ "$GITHUB_REF_NAME" = "main" ]; then args="$args --readme README.md"; fi
          python3 tools/bench_publish.py $args

      - name: Push the results to gh-pages
        working-directory: pages
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bench
          if git diff --cached --quiet; then echo "no change to publish"; exit 0; fi
          git commit -m "bench: $GITHUB_REF_NAME ${GITHUB_SHA::7} (run $GITHUB_RUN_ID) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:gh-pages; then exit 0; fi
            sleep $((2 ** i))
            git pull --rebase -q origin gh-pages
          done
          echo "could not push the results to gh-pages" >&2
          exit 1

      - name: Commit the README summary (default branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          set -u
          if git diff --quiet -- README.md; then echo "README summary unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "README: benchmark summary for run $GITHUB_RUN_ID [skip ci]"
          git push origin HEAD:main || echo "::warning::could not push the README summary to main"

